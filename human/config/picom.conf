vsync = true;
backend = "glx";
daemon = true;
frame-opacity = 1;
inactive-dim-fixed = true;

animations = (
{
    triggers = [ "hide" ];
    preset = "disappear";
    scale = 1.0;
    delay = 0.1;
    duration = 0.1;
},
  triggers = [ "geometry" ];
  scale-x = { curve = "cubic-bezier(0.07, 0.65, 0, 1)"; duration = 0.2; start = "window-width-before / window-width"; end = 1; };
  scale-y = { curve = "cubic-bezier(0.07, 0.65, 0, 1)"; duration = 0.2; start = "window-height-before / window-height"; end = 1; };
  offset-x = { curve = "cubic-bezier(0.07, 0.65, 0, 1)"; duration = 0.2; start = "window-x-before - window-x"; end = 0; };
  offset-y = { curve = "cubic-bezier(0.07, 0.65, 0, 1)"; duration = 0.2; start = "window-y-before - window-y"; end = 0; };
}, {
	triggers = [ "show" ];
	    preset = "appear";
	    scale = 1;
	    duration = 0.1;
}, {
	triggers = ["open"];
	scale-x = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.4;
	        delay = 0;
	        start = 0;
	        end = 1;
	    };
	    offset-x = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.4;
	        delay = 0;
	        start = "window-width / 2";
	        end = 0;
	    };
	    scale-y = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.4;
	        delay = 0;
	        start = 0.5;
	        end = 1;
	    };
	    offset-y = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.4;
	        delay = 0;
	        start = "window-height / 4";
	        end = 0;
	    };
	    opacity = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
	        duration = 0.5;
	        start = 0.1;
	        end = 1;
	    };
},{
	triggers = ["close"];
	scale-x = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.4;
	        delay = 0;
	        start = 1;
	        end = 0.75;
	    };
	    offset-x = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.4;
	        delay = 0;
	        start = 0;
	        end = "window-width / 8";
	    };
	    scale-y = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.4;
	        delay = 0;
	        start = 1;
	        end = 0.75;
	    };
	    offset-y = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.4;
	        delay = 0;
	        start = 0;
	        end = "window-height / 8";
	    };
	    opacity = {
	        curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
	        duration = 0.43;
	        start = 1;
	        end = 0;
	    };
})

rules: ({
  match = "class_g = 'dmenu'";
  animations = (
  	{
		triggers = [ "open", "show" ];
		preset = "appear";
		scale = 1.1;
	},
	{
		triggers = [ "close", "hide" ];
		preset = "disappear";
	}
  );
}, {
	match = "class_g = 'dwm'";
	animations = (
		{
			triggers = [ "open" ];
			preset = "fly-in";
			opacity = { duration = 0; };
		},
		{
			triggers = [ "close" ];
			preset = "fly-out";
			opacity = { duration = 0; };
		}
	);
	corner-radius = 0;
}, {
}, { match = "fullscreen"; corner-radius = 0; },
{
	# xsecurelock's dimmer (autodim): fades by itself, and on cancel must vanish at once
	match = "class_g = 'xsecurelock-dimmer'";
	corner-radius = 0;
	shadow = false;
	animations = ({ triggers = [ "open", "show", "close", "hide" ]; opacity = 1; });
},
{
	match = "class_g = 'Dunst'";
	animations = (
		{
			triggers = [ "open", "show" ];
			offset-x = {
				start = "(window-x - window-width)";
				end = 0;
				curve = "cubic-bezier(0,1,0,1)";
				duration = 0.7;
			};
		},
		{
			triggers = [ "geometry" ];
			preset = "geometry-change";
			duration = 0.2;
		},
		{
			triggers = [ "close", "hide" ];
			preset = "fly-out";
			direction = "left";
			duration = 0.2;
		},
	)

}, {
	match = "class_g = 'Polybar'";
	corner-radius = 0;
	animations = (
		{
			triggers = [ "open", "show" ];
			preset = "fly-in";
			direction = "up";
			curve = "cubic-bezier(0,0,0,1)";
			duration = 0.1;
		},
		{
			triggers = [ "geometry" ];
			preset = "slide-in";
			direction = "up";
			curve = "cubic-bezier(0,0,0,1)";
			duration = 0.2;
		},
		{
			triggers = [ "hide", "close" ];
			preset = "fly-out";
			direction = "up";
			curve = "cubic-bezier(0,0,0,0)";
 			duration = 0.2;
		}
	)
}, {
		match = "class_g = 'Eww'";
		animations = (
			{
				triggers = [ "open", "show" ];
				duration = 0.01;
			},
			{
				triggers = [ "hide", "close", "geometry" ];
				duration = 0;
		)
}, {
		match = "class_g = 'zen'";
		frame-opacity = 0;
},{
		match = "class_g = 'Rofi'";
		animations = (
		{
			triggers = ["open", "show"];
			scale-x = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
			duration = 0.4;
			delay = 0;
			start = 0;
			end = 1;
		    };
		    offset-x = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
			duration = 0.4;
			delay = 0;
			start = "window-width / 2";
			end = 0;
		    };
		    scale-y = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
			duration = 0.4;
			delay = 0;
			start = 0.5;
			end = 1;
		    };
		    offset-y = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
			duration = 0.4;
			delay = 0;
			start = "window-height / 4";
			end = 0;
		    };
		    opacity = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
			duration = 0.5;
			start = 0.1;
			end = 1;
		    };
		})
},


# >>> bspwm-slidefx picom animation >>>
# Managed by bspwm-slidefx. Re-run 'bspwm-slidefx setup-picom' to update values.
# NOT VIBECODED
{
    match = "_MY_CUSTOM_WORKSPACE_SWITCH@ = 1 && window_type = 'normal' && !class_g = 'Polybar' && !class_g = 'eww-bar' && !class_g = 'Dunst'";
    animations = (
        {
            triggers = ["show"];
            offset-x = {
                curve = "cubic-bezier(0,.06,0,1)";
                start = "-400";
                end = "0";
                duration = 0.2;
            };
            shadow-offset-x = "offset-x";
            opacity = {
                curve = "cubic-bezier(0,.06,0,1)";
                start = 0;
                end = "window-raw-opacity";
                duration = 0.2;
            };
            shadow-opacity = "opacity";
        },
        {
            triggers = ["hide"];
            opacity = {
                curve = "cubic-bezier(0,.06,0,1)";
                duration = 0.12;
                start = "window-raw-opacity-before";
                end = 0;
            };
            blur-opacity = 0;
            shadow-opacity = "opacity";
            offset-x = {
                curve = "cubic-bezier(0,.06,0,1)";
                start = "0";
                end = "-400";
                duration = 0.2;
            };
            shadow-offset-x = "offset-x";
        }
    );
},

{
    match = "_MY_CUSTOM_WORKSPACE_SWITCH@ = 2 && window_type = 'normal' && !class_g = 'Polybar' && !class_g = 'eww-bar' && !class_g = 'Dunst'";
    animations = (
        {
            triggers = ["show"];
            offset-x = {
                curve = "cubic-bezier(0,.06,0,1)";
                start = "400";
                end = "0";
                duration = 0.2;
            };
            shadow-offset-x = "offset-x";
            opacity = {
                curve = "cubic-bezier(0,.06,0,1)";
                start = 0;
                end = "window-raw-opacity";
                duration = 0.2;
            };
            shadow-opacity = "opacity";
        },
        {
            triggers = ["hide"];
            opacity = {
                curve = "cubic-bezier(0,.06,0,1)";
                duration = 0.12;
                start = "window-raw-opacity-before";
                end = 0;
            };
            blur-opacity = 0;
            shadow-opacity = "opacity";
            offset-x = {
                curve = "cubic-bezier(0,.06,0,1)";
                start = "0";
                end = "400";
                duration = 0.2;
            };
            shadow-offset-x = "offset-x";
        }
    );
})
# <<< bspwm-slidefx picom animation <<<
