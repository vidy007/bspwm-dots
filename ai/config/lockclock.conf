# Fonts of the lockscreen (~/.local/bin/lockclock). Read on every redraw.
# Family: a fontconfig name, or a comma list — the first installed family wins
# (list families with: fc-list : family). Weight: thin, ultralight, light,
# normal, medium, semibold, bold, ultrabold, heavy.
# Preview without locking: lockclock --png /tmp/lock.png [1366x768] [dark|light]

[fonts]
# big time
time = Gravitas One,IBM Plex Serif
time_weight = semibold
# window count and date
info = IBM Plex Mono
info_weight = medium
