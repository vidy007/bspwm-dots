rules: ({
  match = "class_g = 'dmenu'";
  # animations = (
  #   {
  #       triggers = [ "open", "show" ];
  #       duration = 0;
  #   },
  #   {
  #       triggers = [ "close", "hide" ];
  #       duration = 0;
  #   }
  # );
  animations = (
  	{
		triggers = [ "open", "show" ];
		preset = "appear";
		scale = 1.1;
	},
	{
		triggers = [ "close", "hide" ];
		preset = "disappear";
	}
  );
}, {
	match = "class_g = 'dwm'";
	animations = (
		{
			triggers = [ "open" ];
			preset = "fly-in";
			opacity = { duration = 0; };
		},
		{
			triggers = [ "close" ];
			preset = "fly-out";
			opacity = { duration = 0; };
		}
	);
	corner-radius = 0;
}, {
	# match = "class_g = 'st-256color'";
	# animations = (
	# 	{
	# 		triggers = [ "geometry" ];
	# 		#preset = "geometry-change";
	# 		duration = 0;
	# 	}
	# )
}, { match = "fullscreen"; corner-radius = 0; },
# { match = "monocle"; corner-radius = 0; },
{
	match = "class_g = 'Dunst'";
	animations = (
		{
			triggers = [ "open", "show" ];
			offset-x = {
				start = "(window-x - window-width)";
				end = 0;
				curve = "cubic-bezier(0,1,0,1)";
				duration = 0.7;
			};
		},
		{
			triggers = [ "geometry" ];
			preset = "geometry-change";
			duration = 0.2;
		},
		{
			triggers = [ "close", "hide" ];
			preset = "fly-out";
			direction = "left";
			duration = 0.2;
		},
	)

}, {
	match = "class_g = 'Polybar'";
	corner-radius = 0;
	animations = (
		{
			triggers = [ "open", "show" ];
			preset = "fly-in";
			direction = "up";
			curve = "cubic-bezier(0,0,0,1)";
			duration = 0.1;
		},
		{
			triggers = [ "geometry" ];
			preset = "slide-in";
			direction = "up";
			curve = "cubic-bezier(0,0,0,1)";
			duration = 0.2;
		},
		{
			triggers = [ "hide", "close" ];
			preset = "fly-out";
			direction = "up";
			curve = "cubic-bezier(0,0,0,0)";
 			duration = 0.2;
		}
	)
}, {
		match = "class_g = 'Eww'";
		animations = (
			{
				triggers = [ "open", "show" ];
				# preset = "fly-in";
				# direction = "up";
				# offset-y = {
					# start = 0;
					# end = 0;
				duration = 0.01;
					# curve = "cubic-bezier(0,1,0,1)";
				# };
				# preset = "appear";
				# scale = 1.0;
				# duration = 0;
			},
			{
				triggers = [ "hide", "close", "geometry" ];
				# preset = "disappear";
				# scale = 1.0;
				duration = 0;
				# start = 0;
				# end = 0.01;
				# curve = "cubic-bezier(0,1,0,1)";
			}
		)
}, {
		match = "class_g = 'zen'";
		frame-opacity = 0;
},{
		match = "class_g = 'Rofi'";
		animations = (
		{
			triggers = ["open", "show"];
			scale-x = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
			duration = 0.4;
			delay = 0;
			start = 0;
			end = 1;
		    };
		    offset-x = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
			duration = 0.4;
			delay = 0;
			start = "window-width / 2";
			end = 0;
		    };
		    scale-y = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
			duration = 0.4;
			delay = 0;
			start = 0.5;
			end = 1;
		    };
		    offset-y = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
			duration = 0.4;
			delay = 0;
			start = "window-height / 4";
			end = 0;
		    };
		    opacity = {
			curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
			duration = 0.5;
			start = 0.1;
			end = 1;
		    };
		})
},


